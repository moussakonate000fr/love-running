<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--meta tags for search engines-->
    <meta
      name="description"
      content="Love Running. Club for runners in Dublin, Ireland. Urban running, trail running. Dublin docklands and Phoenix Park"
    />
    <meta
      name="keywords"
      content="love running, run, running club, runners, Ireland, Dublin, sport, exercise"
    />
    <!--title-->
    <title>Love Running</title>
    <!--Favicon-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <a href="index.html">
        <h1 id="logo">Love Running</h1>
      </a>
      <input type="checkbox" id="nav-toggle" name="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label"
        ><i class="fa-solid fa-bars"></i
      ></label>
      <nav>
        <ul id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="signup.html" class="active">Sign Up</a></li>
        </ul>
      </nav>
    </header>
    <!--Add your paragraphe-->
    <main>
      <section id="signup">
        <form
          id="signup-form"
          method="POST"
          action="https://formdump.codeinstitute.net/"
        >
          <h2>
            <i class="fa-solid fa-heart-pulse"></i> Let's get you signed up!
          </h2>
          <label for="first-name">First Name</label
          ><input
            type="text"
            id="first-name"
            class="text-input"
            name="first_name"
            required="required"
          /><br />
          <label for="last-name">Last Name</label
          ><input
            type="text"
            id="last-name"
            class="text-input"
            name="last_name"
            required="required"
          /><br />
          <label for="email-address">Email Address</label
          ><input
            type="email"
            id="email-address"
            class="text-input"
            name="email_address"
            required="required"
          /><br />
          <div class="radio-buttons">
            <div><label for="road">Road</label><input type="radio" id="road" name="running_preference" value="road" required="required" checked="checked"></div>
            <div><label for="trail">Trail</label><input type="radio" id="trail" name="running_preference" value="trail"></div>
            <div><label for="both">Both</label><input type="radio" id="both" name="running_preference" value="both"></div>
          </div>
          <button class="join-button" type="submit">Let's Run!</button>
        </form>
      </section>
    </main>
    <!--Footer for Social link or Contact info-->
    <footer>
      <ul id="social-networks">
        <li>
          <a
            href="https://www.Facebook.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in the new tab)"
            ><i class="fa-brands fa-facebook"></i
          ></a>
        </li>
        <li>
          <a
            href="https://www.Instagram.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in the new tab)"
            ><i class="fa-brands fa-instagram"></i
          ></a>
        </li>
        <li>
          <a
            href="https://www.Youtube.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in the new tab)"
            ><i class="fa-brands fa-square-youtube"></i
          ></a>
        </li>
        <li>
          <a
            href="https://www.Twiter.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in the new tab)"
            ><i class="fa-brands fa-x-twitter"></i
          ></a>
        </li>
      </ul>
    </footer>

    <!-- Font Awesome Kit -->
    <script
      src="https://kit.fontawesome.com/a1428b703b.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
